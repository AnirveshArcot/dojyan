services:
  api:
    build: ./backend
    environment:
      ELEXON_API_BASE_URL: ${ELEXON_API_BASE_URL:-https://data.elexon.co.uk/bmrs/api/v1}
      ELEXON_CACHE_DIR: /data/elexon-cache
      ELEXON_CACHE_TTL_SECONDS: ${ELEXON_CACHE_TTL_SECONDS:-21600}
      ELEXON_CACHE_STALE_TTL_SECONDS: ${ELEXON_CACHE_STALE_TTL_SECONDS:-86400}
      ELEXON_CACHE_ENABLED: ${ELEXON_CACHE_ENABLED:-true}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    ports:
      - "8000:8000"
    volumes:
      - elexon-cache:/data/elexon-cache

  web:
    build: ./frontend
    environment:
      VITE_PROXY_TARGET: http://api:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  elexon-cache:
